name: Prism Alpha — live evaluation

# Turns on real live tracking for Prism Alpha + Prism Alpha 2 (one call
# evaluates both, see evaluate_prism_alpha) -- the /admin/prism-alpha-evaluate
# route already existed (docstring recommends every 1 minute) but had
# nothing scheduling it, same gap momentum/GMP/Lumen SIP had before this
# session. GitHub Actions cron only reliably supports 5-minute granularity,
# not literal 1-minute -- true 1-minute cadence would need an always-on
# in-process loop (needs the Render plan confirmed first, deferred). This is
# the practical interim mechanism: checks every 5 minutes during market
# hours, still real signal-driven entries/exits, just a coarser polling
# cadence than the ideal spec.
# 03:45-10:00 UTC = 09:15-15:30 IST, weekdays only.
#
# RESUMED (2026-08-04), Prism Alpha 2 only: was paused 2026-07-29 to cut
# Render memory/load while the free-tier instance was crash-restarting.
# Re-enabled per explicit instruction ("prism alpha 2 on... I want all the
# logs") -- backend/blackbox_prism_alpha.py's ACTIVE_LIVE_VARIANTS now
# scopes this call to just prism_alpha_2 regardless, so this schedule
# firing evaluates that variant only even though the endpoint's own name
# still says "both".
# Re-saved 2026-08-10 to force GitHub to re-register this schedule -- every cron in this repo went silent after the 2026-08-06/07 GitHub Actions outage (confirmed: last scheduled run was 2026-08-07, workflow still showed state=active, GitHub never resumed firing it on its own).
on:
  schedule:
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Call prism-alpha-evaluate
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://sapphire-alpha-backend.onrender.com/api/blackbox/admin/prism-alpha-evaluate" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::prism-alpha-evaluate failed with status $status"
            exit 1
          fi
