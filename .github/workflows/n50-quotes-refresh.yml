name: N50 Quote Board — auto refresh

# Recomputes the Nifty 50 ticker/gainers-losers quote board (LTP + prev
# close per constituent) throughout the trading session. Needs a live
# Definedge session (daily OTP auto-login handles that) -- self-skips
# via n50_quotes.py's own per-symbol guard if the session is down, same
# as every other Definedge-backed cron in this repo.
# 03:45-10:00 UTC = 09:15-15:30 IST, weekdays only, every 5 minutes.
# Restored to every 5 minutes (2026-08-25) now that the backend is on
# Render's Starter plan -- was reduced to every 15 minutes (2026-08-23)
# only to cut bandwidth on the free tier's monthly quota, which no
# longer applies.
on:
  schedule:
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call n50-quotes/admin/refresh
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://sapphire-alpha-backend.onrender.com/api/terminal/n50-quotes/admin/refresh" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::n50-quotes/admin/refresh failed with status $status"
            exit 1
          fi
