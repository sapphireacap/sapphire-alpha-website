name: Intraday Momentum Scanner — auto refresh

# Refreshes every Nifty 500 constituent's raw intraday closes/volume for
# the Intraday Momentum Scanner (see intraday_momentum_routes.py). The
# public scanner's filters (period, EMA, retracement, relative momentum)
# all compute LIVE off this cached series per request, so the series
# itself needs to stay fresh through the session -- this is what makes
# that "live".
# Every 15 minutes during the session (heavier than N50/OI Buildup --
# fetches per-symbol minute bars, not just a quote/price-change, across
# the full Nifty 500) -- 03:45-10:00 UTC = 09:15-15:30 IST, weekdays only.
# Added 2026-08-25 now that the backend is on Render's Starter plan.
on:
  schedule:
    - cron: "45 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call intraday-momentum/admin/refresh
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://sapphire-alpha-backend.onrender.com/api/intraday-momentum/admin/refresh" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::intraday-momentum/admin/refresh failed with status $status"
            exit 1
          fi
