name: Momentum track record — daily evaluation

# Fills in close/performance data for the Intraday Momentum Leaders scanner's
# pending calls once their trading day has closed. Entry prices are already
# captured automatically whenever the (external) daily sync replaces the
# scanner's stock list — this is the other half, and previously had nothing
# calling it on a schedule at all, so Historical Performance just stopped
# updating. 10:15 UTC = 15:45 IST, 15 minutes after NSE close, weekdays only.
# Safe to run on a holiday/weekend — evaluate_pending() just finds nothing to
# evaluate and returns cleanly (see backend/momentum_track_record.py).
# Re-saved 2026-08-10 to force GitHub to re-register this schedule -- every cron in this repo went silent after the 2026-08-06/07 GitHub Actions outage (confirmed: last scheduled run was 2026-08-07, workflow still showed state=active, GitHub never resumed firing it on its own).
#
# Schedule trigger removed 2026-08-12 -- Intraday Momentum Leaders was
# turned off (live: false in modules.js) at the user's explicit direction
# ("delete everything from the background, only keep the tile"). No
# schedule left calling this at all now; workflow_dispatch kept only so
# it can still be re-run by hand if the module is ever turned back on.
on:
  workflow_dispatch: {}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Call momentum-track-evaluate
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://sapphire-alpha-backend.onrender.com/api/admin/terminal/momentum-track-evaluate" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::momentum-track-evaluate failed with status $status"
            exit 1
          fi
