name: Index Vector — auto refresh

# Recomputes the confluence bias + flip levels for all 4 Index Vector
# indices (NIFTY/BANKNIFTY/FINNIFTY) throughout the trading session.
# /admin/definedge/auto-refresh already existed for exactly this (skips
# cleanly outside market hours / when Definedge isn't connected) but had
# nothing scheduling it -- same gap as every other feature this session.
# Confirmed live: real signal data was sitting 19 hours stale with no
# indication anything was wrong, because nothing was calling this route at
# all. Note this does NOT remove the daily manual OTP login requirement --
# Definedge's own session resets every trading day, so this cron will
# correctly no-op (see the route's own "not connected" skip) until that
# morning login has been done; it only fixes staleness DURING a session
# that's already been logged into.
# 03:45-10:00 UTC = 09:15-15:30 IST, weekdays only, every 5 minutes (the
# finest granularity GitHub Actions cron reliably supports).
#
# The route catches each index's compute_vector() error individually and
# reports it IN the 200 response body (server.py's auto-refresh handler) so
# one index failing never blocks the others -- but that also means a 200
# HTTP status alone proves nothing about whether every index actually
# refreshed. Confirmed live (2026-08-05): BANKNIFTY/FINNIFTY sat 2 days
# stale while this workflow kept reporting green on every tick, because
# nothing here ever looked past the status code into the response body.
# Now greps the body for a per-index "error" key and fails the job if any
# index reported one, so a silent per-index failure shows up as a red run
# instead of going unnoticed for days.
# Re-saved 2026-08-10 to force GitHub to re-register this schedule -- every cron in this repo went silent after the 2026-08-06/07 GitHub Actions outage (confirmed: last scheduled run was 2026-08-07, workflow still showed state=active, GitHub never resumed firing it on its own).
on:
  schedule:
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call definedge/auto-refresh
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://sapphire-alpha-backend.onrender.com/api/admin/definedge/auto-refresh" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::definedge/auto-refresh failed with status $status"
            exit 1
          fi
          if python3 -c "import json,sys; d=json.load(open('response.json')); sys.exit(1 if any(isinstance(v, dict) and 'error' in v for v in d.values()) else 0)"; then
            :
          else
            echo "::error::One or more indices reported an error in the auto-refresh response — see response.json above."
            exit 1
          fi
