name: Definedge — daily OTP auto-login

# Runs the full daily Definedge OTP login automatically (trigger OTP ->
# read it off the dedicated Gmail inbox -> verify), so the manual
# "open the admin panel and paste in a code" step every trading morning
# (Admin.jsx's DefinedgeConnect) is no longer required. See
# backend/definedge_otp_email.py for the mailbox side and
# server.py's /admin/definedge/otp-auto-login for the route.
#
# 03:30 UTC = 09:00 IST, 15 minutes before NSE's 09:15 open and before
# index-vector-auto-refresh.yml's first tick (03:45 UTC) -- that cron
# explicitly no-ops until this morning login has happened, so this one
# needs to land first. EVERY day, not just weekdays (by request) -- the
# route itself still skips cleanly if Definedge isn't configured or a
# session is already connected (e.g. this ran twice, or someone already
# logged in by hand), so a weekend/holiday run just triggers a harmless
# extra login rather than anything actually running against a closed
# market.
#
# --max-time is 240s, not 120s (fixed 2026-08-11): the route itself polls the
# OTP mailbox for up to POLL_TIMEOUT_SECONDS=90s (definedge_otp_email.py),
# on top of the trigger_otp()/verify_otp() calls, per-poll IMAP connect/login/
# search overhead, and possible Render cold-start latency -- 120s left
# essentially no margin. Confirmed live: curl exit 28 (timeout) at exactly
# 2m01s while the backend was very likely about to succeed.
# Schedule trigger disabled 2026-08-11 -- migrated to a cron-job.org job
# ("DE OTP login") for more reliable on-time firing than GH Actions' own
# best-effort scheduler (confirmed live: this workflow's cron fired 2h42m
# late that same day). workflow_dispatch stays as a manual fallback.
on:
  workflow_dispatch: {}

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Call definedge/otp-auto-login
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            --max-time 240 \
            "https://sapphire-alpha-backend.onrender.com/api/admin/definedge/otp-auto-login" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::definedge/otp-auto-login failed with status $status"
            exit 1
          fi
