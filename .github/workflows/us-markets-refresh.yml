name: US Markets — daily refresh

# Recomputes Momentum Investing (12-1 risk-adjusted), Momentum Leaders
# (1w/1m), and X-Percent Breadth for the S&P 500 universe once daily
# after the US close. Each /us-markets/*/admin/refresh route only kicks
# off its background job and returns immediately (a full ~503-symbol
# pass is a multi-minute job, same shape as quant-lab-momentum-refresh.yml)
# -- this cron just triggers all three, it doesn't wait for completion.
# Schedule trigger disabled 2026-08-23 -- folded into the single
# "Refresh All EOD Tools" admin button (see server.py's
# /admin/eod-refresh-all), same reasoning as breadth-refresh.yml.
# workflow_dispatch kept as a manual fallback.
on:
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call us-markets/momentum-investing/admin/refresh
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://sapphire-alpha-backend.onrender.com/api/us-markets/momentum-investing/admin/refresh" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::us-markets/momentum-investing/admin/refresh failed with status $status"
            exit 1
          fi
      - name: Call us-markets/momentum-leaders/admin/refresh
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://sapphire-alpha-backend.onrender.com/api/us-markets/momentum-leaders/admin/refresh" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::us-markets/momentum-leaders/admin/refresh failed with status $status"
            exit 1
          fi
      - name: Call us-markets/breadth/admin/refresh
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://sapphire-alpha-backend.onrender.com/api/us-markets/breadth/admin/refresh" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::us-markets/breadth/admin/refresh failed with status $status"
            exit 1
          fi
