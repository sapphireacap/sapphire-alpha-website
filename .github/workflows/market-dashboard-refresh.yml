name: Market Dashboard — auto refresh

# Recomputes the Market Dashboard snapshot (NSE allIndices + FII/DII +
# 52-week hi/lo + Yahoo global indices) throughout the trading session.
# Deliberately independent of Definedge -- this is the one live module
# that doesn't need the daily OTP login, so it can run on this schedule
# with no "not connected" skip the way Index Vector's cron has.
# 03:45-10:00 UTC = 09:15-15:30 IST, weekdays only, every 5 minutes.
# Re-saved 2026-08-10 to force GitHub to re-register this schedule -- every cron in this repo went silent after the 2026-08-06/07 GitHub Actions outage (confirmed: last scheduled run was 2026-08-07, workflow still showed state=active, GitHub never resumed firing it on its own).
on:
  schedule:
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call market-dashboard/admin/refresh
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://sapphire-alpha-backend.onrender.com/api/terminal/market-dashboard/admin/refresh" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::market-dashboard/admin/refresh failed with status $status"
            exit 1
          fi
