services:
  - type: web
    name: sapphire-alpha-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFINEDGE_API_TOKEN
        sync: false
      - key: DEFINEDGE_API_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      # Dhan — the IV / option-chain / Greeks source (Definedge has no
      # Greeks or IV endpoint at all). Declared here so production is
      # documented as needing them; the values themselves are set in the
      # Render dashboard, same as every other sync:false key above.
      # Note these are separate from Definedge's: Dhan access tokens are
      # time-limited and need regenerating when they lapse, which shows up
      # as HTTP 401 DH-901 on every endpoint, /v2/profile included.
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: DHAN_CLIENT_ID
        sync: false
